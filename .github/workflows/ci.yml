name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pnpm/lint/typecheck/build on a Linux (case-sensitive) runner. This also
  # guards resources/js/Pages: git tracks only the capital-P casing, and a
  # bad import that only works on macOS's case-folding APFS fails here.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # PHPUnit against the ci compose stack (docker-compose.yml + docker-compose.ci.yml).
  backend:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The root blade view resolves @vite tags against public/build/manifest.json;
      # that directory is gitignored, so it must be built before any full-page
      # Inertia response is rendered (assertInertia() requests aren't XHR-only,
      # they hit the same blade view PHPUnit's TestResponse renders).
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Configure environment
        run: cp .env.example .env

      - name: Start Postgres
        run: $COMPOSE up -d --build postgres

      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            if $COMPOSE exec -T postgres pg_isready -U postgres -d laravel; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      # phpunit.xml points tests at laravel_testing; the ci postgres service
      # only creates POSTGRES_DB (laravel). --recreate-databases derives the
      # per-process databases from this one, so it has to exist first.
      - name: Create test database
        run: $COMPOSE exec -T postgres createdb -U postgres laravel_testing

      - name: Install PHP dependencies
        run: $COMPOSE run --rm -T php composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: $COMPOSE run --rm -T php php artisan key:generate --no-interaction

      - name: Run backend test suite
        run: $COMPOSE run --rm -T php php artisan test --compact --parallel --recreate-databases

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
