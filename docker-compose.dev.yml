# OrbStack injects a broken HTTP(S)_PROXY (proxyproxy.orb.internal) into every
# container, routing outbound HTTP through a proxy whose host fails DNS. Neutralise
# it for every PHP service that makes outbound calls (web, scrapers/queued jobs,
# scheduler) so scrapers can reach the internet.
x-no-proxy: &no-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  ALL_PROXY: ""
  all_proxy: ""

services:
  php:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.php
    stop_signal: SIGTERM
    # Override the base image's default command so dev runs Octane with
    # the --watch flag. Watched paths live in config/octane.php; chokidar-cli
    # is installed via Dockerfile.php's development stage.
    # Note on --watch: FrankenPHP + Octane + chokidar segfaults reliably on
    # this Alpine + macOS-bind-mount combination (exit 139 within seconds,
    # with or without --poll). Watch deps (Node + chokidar) are installed
    # for opt-in use via:
    #   spin exec -T php php artisan octane:start --watch --poll
    # When upstream stabilizes, restore --watch to the default command.
    environment: *no-proxy
    volumes:
      - .:/var/www/html/
    networks:
      - vantagejobs
      - spin-proxy
    extra_hosts:
      # Let PHP reach its own public hostnames through the shared proxy on the host
      - "vantagejobs.test:host-gateway"
      - "vite.vantagejobs.test:host-gateway"
      - "mailpit.vantagejobs.test:host-gateway"
    depends_on:
      postgres:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=spin-proxy"
      - "traefik.http.routers.vantagejobs-web.rule=Host(`vantagejobs.test`) || HostRegexp(`^.+\\.ngrok-free\\.app$$`)"
      - "traefik.http.routers.vantagejobs-web.tls=true"
      - "traefik.http.routers.vantagejobs-web.entrypoints=websecure"
      - "traefik.http.services.vantagejobs-web.loadbalancer.server.port=8080"
      - "traefik.http.services.vantagejobs-web.loadbalancer.server.scheme=http"
  node:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.node
    command: pnpm dev
    volumes:
      - .:/usr/src/app/
    working_dir: /usr/src/app/
    networks:
      - vantagejobs
      - spin-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=spin-proxy"
      - "traefik.http.routers.vantagejobs-vite.rule=HostRegexp(`vite.vantagejobs.test`)"
      - "traefik.http.routers.vantagejobs-vite.entrypoints=websecure"
      - "traefik.http.routers.vantagejobs-vite.tls=true"
      - "traefik.http.services.vantagejobs-vite.loadbalancer.server.port=5173"
      - "traefik.http.services.vantagejobs-vite.loadbalancer.server.scheme=https"
  mailpit:
    image: axllent/mailpit
    networks:
      - vantagejobs
      - spin-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=spin-proxy"
      - "traefik.http.routers.vantagejobs-mailpit.rule=Host(`mailpit.vantagejobs.test`)"
      - "traefik.http.routers.vantagejobs-mailpit.entrypoints=websecure"
      - "traefik.http.routers.vantagejobs-mailpit.tls=true"
      - "traefik.http.services.vantagejobs-mailpit.loadbalancer.server.port=8025"
      - "traefik.http.services.vantagejobs-mailpit.loadbalancer.server.scheme=http"
  schedule:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.php
    environment: *no-proxy
    volumes:
      - .:/var/www/html/
    networks:
      - vantagejobs
    extra_hosts:
      - "vantagejobs.test:host-gateway"
      - "vite.vantagejobs.test:host-gateway"
      - "mailpit.vantagejobs.test:host-gateway"
    depends_on:
      php:
        condition: service_started
      postgres:
        condition: service_healthy
  postgres:
    networks:
      - vantagejobs
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vantagejobs}
      POSTGRES_USER: ${DB_USERNAME:-vantagejobs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vantagejobs}
    ports:
      - target: 5432
        published: ${DB_FORWARD_PORT:-49417}
        mode: host
  redis:
    command: "redis-server --appendonly yes --requirepass redispassword"
    volumes:
      - redis_data:/data
    networks:
      - vantagejobs
  horizon:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.php
    environment: *no-proxy
    volumes:
      - .:/var/www/html/
    networks:
      - vantagejobs
    extra_hosts:
      - "vantagejobs.test:host-gateway"
      - "vite.vantagejobs.test:host-gateway"
      - "mailpit.vantagejobs.test:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      php:
        condition: service_started
networks:
  vantagejobs:
  spin-proxy:
    external: true


volumes:
  postgres_data:
  redis_data:
