services:
  traefik:
    environment:
      # OrbStack injects HTTP(S)_PROXY into every container; Traefik (Go) honours
      # them for outbound calls, which routes backend traffic through OrbStack's
      # proxy and breaks reverse-proxying to in-network services.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Uncomment to enable Traefik's dashboard
    networks:
      development:
        aliases:
          - vantagejobs.test
          - vite.dev.test
          - mailpit.dev.test
          - reverb.dev.test
          - meilisearch.dev.test
    volumes:
      # Mount the Docker socket as read-only so Traefik can listen to events
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.infrastructure/conf/traefik/dev/traefik.yml:/traefik.yml:ro
      - ./.infrastructure/conf/traefik/dev/traefik-certs.yml:/traefik-certs.yml
      - ./.infrastructure/conf/traefik/dev/certificates/:/certificates
  php:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.php
    stop_signal: SIGTERM
    # Override the base image's default command so dev runs Octane with
    # the --watch flag. Watched paths live in config/octane.php; chokidar-cli
    # is installed via Dockerfile.php's development stage.
    # Note on --watch: FrankenPHP + Octane + chokidar segfaults reliably on
    # this Alpine + macOS-bind-mount combination (exit 139 within seconds,
    # with or without --poll). Watch deps (Node + chokidar) are installed
    # for opt-in use via:
    #   spin exec -T php php artisan octane:start --watch --poll
    # When upstream stabilizes, restore --watch to the default command.
    volumes:
      - .:/var/www/html/
    networks:
      - development
    depends_on:
      postgres:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel-web.rule=Host(`vantagejobs.test`) || HostRegexp(`^.+\\.ngrok-free\\.app$$`)"
      - "traefik.http.routers.laravel-web.tls=true"
      - "traefik.http.routers.laravel-web.entrypoints=websecure"
      - "traefik.http.services.laravel-web.loadbalancer.server.port=8080"
      - "traefik.http.services.laravel-web.loadbalancer.server.scheme=http"
  node:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.node
    command: npm run dev
    volumes:
      - .:/usr/src/app/
    working_dir: /usr/src/app/
    networks:
      - development
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vite.rule=HostRegexp(`vite.dev.test`)"
      - "traefik.http.routers.vite.entrypoints=websecure"
      - "traefik.http.routers.vite.tls=true"
      - "traefik.http.services.vite.loadbalancer.server.port=5173"
      - "traefik.http.services.vite.loadbalancer.server.scheme=https"
  mailpit:
    image: axllent/mailpit
    networks:
      - development
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.dev.test`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "traefik.http.services.mailpit.loadbalancer.server.scheme=http"
  schedule:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.php
    volumes:
      - .:/var/www/html/
    networks:
      - development
    depends_on:
      php:
        condition: service_started
      postgres:
        condition: service_healthy
  postgres:
    networks:
      - development
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vantagejobs}
      POSTGRES_USER: ${DB_USERNAME:-vantagejobs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vantagejobs}
    ports:
      - target: 5432
        published: 5432
        mode: host
  redis:
    command: "redis-server --appendonly yes --requirepass redispassword"
    volumes:
      - redis_data:/data
    networks:
      - development
  horizon:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
      dockerfile: Dockerfile.php
    volumes:
      - .:/var/www/html/
    networks:
      - development
    depends_on:
      redis:
        condition: service_healthy
      php:
        condition: service_started
networks:
  development:


volumes:
  postgres_data:
  redis_data:
